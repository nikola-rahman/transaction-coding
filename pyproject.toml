[project]
name = "transaction-coding"
version = "0.1.0"
description = "Suggest an account for each business transaction from the company's own chart of accounts and history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []  # data preparation, row building, baselines and analysis use the standard library only

[project.optional-dependencies]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2"]
gpu = ["unsloth", "torch", "transformers", "datasets", "fastapi>=0.115", "uvicorn>=0.30"]  # training, scoring and the inference server, on a CUDA machine

[tool.uv]
package = false
